[project]
name = "delta-api"
version = "0.1.0"
description = "Delta Observatory stateless application API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "psycopg[binary,pool]==3.3.6",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pgserver==0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
